name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# This workflow owns the only required status check (`CI Gate`), so it must never be
# filtered out. A workflow skipped by `paths`/`paths-ignore` reports no check runs at all,
# and a required check that never reports blocks the pull request forever and eventually
# times the entry out of the merge queue.
#
# `needs:` cannot reference a job in a different workflow file, which is why every gated
# job is called from here. The work itself lives in the `reusable-*.yml` building blocks.
# Those have to sit directly in `.github/workflows/` - GitHub does not support reusable
# workflows in subdirectories, and a `./.github/workflows/<dir>/<file>.yml` reference fails
# at run time rather than being caught by a linter. Hence the filename prefix instead of a
# folder.

concurrency:
  # Supersede in-flight runs for the same pull request, but never cancel a merge queue run:
  # a cancelled run reports a non-success conclusion and ejects the pull request from the
  # queue. Deliberately not set in the called workflows - sharing a group between caller and
  # callee makes a run cancel itself.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build.yml

  coverage:
    name: Coverage
    # Coverage is a reporting concern, not a merge gate. The `gh-readonly-queue/*` ref a
    # merge group builds is thrown away, so uploading it to Codecov is meaningless, and
    # `build` already runs the same tests on the same platforms inside the queue.
    # This is the only job `ci-gate` is allowed to see as `skipped`.
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-coverage.yml
    secrets:
      codecov-token: ${{ secrets.CODECOV_UPLOAD_TOKEN }}

  format:
    name: Format
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-format.yml

  e2e:
    name: E2E
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-e2e.yml

  aot:
    name: AOT
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-aot.yml

  packaging:
    name: Packaging
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-packaging.yml

  # The single required status check. Branch protection lists `CI Gate` and nothing else
  # from this workflow, so jobs and matrix legs can be added, removed or renamed without
  # silently detaching branch protection.
  #
  # `if: always()` is mandatory. Without it this job inherits the implicit `success()`
  # condition, so a failing dependency makes it *skipped* - and branch protection treats a
  # skipped check as satisfied, which would let exactly the broken pull requests through.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [build, coverage, format, e2e, aot, packaging]

    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check that every gated job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Jobs allowed to report `skipped`. Anything else that skips fails the gate, so an
          # accidental `if:` cannot quietly stop gating a job.
          ALLOWED_SKIPS: coverage
        run: |
          {
            echo "### CI Gate"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS_JSON" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          failing=$(echo "$NEEDS_JSON" | jq -r --arg allowed "$ALLOWED_SKIPS" '
            ($allowed | split(",") | map(select(length > 0))) as $ok
            | to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or ([.key] - $ok | length) > 0)
            | "\(.key): \(.value.result)"
          ')

          if [ -n "$failing" ]; then
            echo "::error::One or more gated jobs did not succeed:"
            echo "$failing"
            exit 1
          fi

          echo "All gated jobs succeeded or were intentionally skipped."
