name: Reusable / Format

on:
  workflow_call:

jobs:
  format:
    name: dotnet format

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: dotnet format
        run: |
          dotnet format --verify-no-changes OpenFeature.slnx
