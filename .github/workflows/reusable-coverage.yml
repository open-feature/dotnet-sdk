name: Reusable / Code Coverage

on:
  workflow_call:
    secrets:
      codecov-token:
        description: "Codecov upload token."
        required: true

jobs:
  coverage:
    name: ${{ matrix.os }}

    permissions:
      contents: read
      pull-requests: write
      code-quality: write

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Check out the PR head commit (not the merge commit) so coverage line numbers map to the diff
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Run Test
        run: dotnet test --coverlet --coverlet-output-format opencover cobertura --ignore-exit-code 8

      # Keep globbing on non-Windows runners (works today)
      - name: Upload coverage to Codecov (non-Windows)
        if: runner.os != 'Windows'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          name: Code Coverage for ${{ matrix.os }}
          files: "**/TestResults/**/coverage.opencover.*.xml"
          disable_search: true
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.codecov-token }}

      # On Windows, avoid passing a glob that expands into multiple args
      - name: Find coverage reports (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "$PWD" -Recurse -Filter "coverage.opencover.*.xml" | ForEach-Object { $_.FullName }
          if (-not $files -or $files.Count -eq 0) {
            throw "No coverage.opencover.*.xml files were found under the repository."
          }

          # Codecov accepts comma-separated file paths
          $csv = ($files -join ",")
          "CODECOV_FILES=$csv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload coverage to Codecov (Windows)
        if: runner.os == 'Windows'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          name: Code Coverage for ${{ matrix.os }}
          files: ${{ env.CODECOV_FILES }}
          disable_search: true
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.codecov-token }}

      # GitHub's code coverage API takes a single Cobertura file, so merge the per-project/per-TFM reports.
      # Paths are rewritten to be repository-relative so coverage maps onto the files in the diff.
      - name: Merge Cobertura reports (Linux)
        if: runner.os == 'Linux'
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"**/coverage.cobertura.*.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:Cobertura \
            -filefilters:"-**/obj/**"
          sed -i -e "s#${GITHUB_WORKSPACE}/##g" \
                 -e "s#<source>[^<]*</source>#<source>.</source>#g" \
                 coverage-report/Cobertura.xml

      - name: Upload coverage to GitHub (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1.4.1
        with:
          file: coverage-report/Cobertura.xml
          language: C#
          label: code-coverage/coverlet
          # Best effort: a coverage-service outage must never block CI. Codecov remains the gate.
          fail-on-error: false
